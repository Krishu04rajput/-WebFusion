<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebFusion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: min(1100px, 94vw);
            text-align: center;
            margin: auto;
        }

        h1 {
            font-size: 45px;
            margin: 0 0 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        /* Emulator display */

        .screen {
            background: #111;
            border: 2px solid #333;
            border-radius: 18px;

            width: 100%;
            aspect-ratio: 16 / 9;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        #screen_container {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #screen_container canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .screen-content {
            color: #777;
            font-size: 18px;
        }

        /* Buttons */

        .buttons {
            margin-top: 20px;

            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 14px 25px;

            border: none;
            border-radius: 10px;

            font-size: 16px;

            cursor: pointer;

            transition: transform 0.15s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 15px;
            color: #aaa;
        }

        /* iPad / Mobile */

        @media (max-width: 700px) {

            body {
                min-height: 100dvh;
                padding: 20px 0;
                align-items: flex-start;
            }

            .container {
                width: 94vw;
            }

            h1 {
                font-size: 34px;
                margin-top: 20px;
            }

            .subtitle {
                margin-bottom: 18px;
            }

            .screen {
                aspect-ratio: 16 / 10;
                border-radius: 14px;
            }

            .buttons {
                flex-direction: column;
                gap: 8px;
            }

            button {
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <h1>⚡ WebFusion</h1>

        <div class="subtitle">
            Browser OS Emulator
        </div>


        <!-- EMULATOR SCREEN -->

        <div class="screen">

            <div id="screen_container">

                <div
                    id="screenText"
                    class="screen-content">
                    🖥️ Emulator is waiting...
                </div>

                <canvas style="display: none;"></canvas>

            </div>

        </div>


        <!-- OS BUTTONS -->

        <div class="buttons">

            <button onclick="startAndroid()">
                🤖 Start Android
            </button>

            <button onclick="startWindows()">
                🪟 Start Windows
            </button>

        </div>


        <div id="status">
            Select an operating system
        </div>

    </div>


    <!-- WebFusion JavaScript -->

    <script>

        function startAndroid() {

            document.getElementById("screenText").innerHTML =
                "🤖 Android Emulator Starting...";

            document.getElementById("status").innerHTML =
                "Android selected";

        }


        function startWindows() {

            document.getElementById("screenText").innerHTML =
                "🪟 Windows Emulator Starting...";

            document.getElementById("status").innerHTML =
                "Windows Emulator Starting...";

        }

    </script>


    <!-- Our emulator core -->

    <script src="src/emulator.js"></script>

</body>

</html>
