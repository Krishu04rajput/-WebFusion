<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebFusion</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .box {
            padding: 40px;
            border: 1px solid #333;
            border-radius: 20px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            color: #aaa;
        }

        button {
            padding: 14px 25px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>⚡ WebFusion</h1>

        <p>Browser-based OS Emulator</p>

        <button>🤖 Android</button>
        <button>🪟 Windows</button>
    </div>

</body>
</html>
